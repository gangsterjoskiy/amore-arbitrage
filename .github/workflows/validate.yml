name: Validate
on:
  pull_request:
  push:
    branches: [main, feature/demo-balances-arbi-trading]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check src/index.js
      - run: node --check src/demo.js
      - run: node --check src/paper.js
