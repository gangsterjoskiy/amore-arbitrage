name: Validate
on:
  pull_request:
  push:
    branches: [main, feature/demo-balances-arbi-trading, feature/30-day-auto-paper]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npm run check
